name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    name: ${{ matrix.configuration }} | ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2.0.0

      - name: Restore NuGet packages
        run: nuget restore UpdateManagers.sln

      - name: Build
        run: |
          msbuild UpdateManagers.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /m `
            /verbosity:minimal

      - name: Locate build outputs
        if: matrix.configuration == 'Release'
        run: Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -ExpandProperty FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: UpdateManagers-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            **/${{ matrix.configuration }}/UpdateManager-Push.exe
            **/${{ matrix.configuration }}/${{ matrix.platform }}/UpdateManager-Push.exe
            **/${{ matrix.configuration }}/UpdateManager-Pull.exe
            **/${{ matrix.configuration }}/${{ matrix.platform }}/UpdateManager-Pull.exe
          if-no-files-found: error
